[project]
name = "transitmind"
version = "0.0.1"
description = "A transportation data agent built from small, explainable components."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3.0",
    "python-dotenv>=1.1,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlglot==30.22.0",
]

[project.optional-dependencies]
vector = ["fastembed==0.9.0"]
graph = ["neo4j==6.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transitmind*"]

