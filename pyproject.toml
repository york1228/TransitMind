[project]
name = "transitmind"
version = "0.0.1"
description = "A transportation data agent built from small, explainable components."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3.0",
    "httpx>=0.23,<1.0",
    "python-dotenv>=1.1,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlglot==30.22.0",
]

[project.optional-dependencies]
vector = ["fastembed==0.9.0"]
graph = ["neo4j==6.3.0"]
web = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "pydantic>=2.0,<3.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# 默认不跑付费评测；显式 `pytest -m eval --run-live-evals` 才会调用真实模型。
addopts = "-m 'not eval'"
markers = [
    "eval: live Agent evaluation against the frozen question set (costs API usage)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transitmind*"]

[tool.setuptools.package-data]
transitmind = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*", "resources/*.json"]

